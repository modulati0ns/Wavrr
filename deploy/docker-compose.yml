# Wavrr servido por un nginx mínimo, detrás de Nginx Proxy Manager.
#
# La aplicación es estática: index.html y la carpeta fonts/. No hay backend, ni
# base de datos, ni variables de entorno. NPM se pone delante para el dominio,
# el certificado y las cabeceras de seguridad (ver deploy/README.md).
#
#   1. Copia index.html y fonts/ a la ruta del volumen de abajo
#   2. docker compose up -d
#   3. En NPM: Proxy Host → reenviar a  IP-del-NAS : 8089
#
name: wavrr

services:
  wavrr:
    image: nginx:alpine
    container_name: wavrr
    restart: unless-stopped
    ports:
      - "8089:80"
    volumes:
      # Ruta de Unraid. En Synology suele ser /volume1/docker/wavrr y en QNAP
      # /share/Container/wavrr.
      - /mnt/user/appdata/wavrr:/usr/share/nginx/html:ro

# Variante: si tu NPM tiene una red propia (docker network ls), puedes quitar
# «ports» y conectar el contenedor a esa red; entonces en NPM se reenvía a
# wavrr : 80 por nombre. En la red «bridge» por defecto eso no funciona, porque
# ahí Docker no resuelve nombres de contenedor.
#
#     networks: [npm]          # dentro de services.wavrr
#   networks:
#     npm:
#       external: true
#       name: <nombre-de-la-red-de-npm>
