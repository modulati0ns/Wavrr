name: Verificación de la física

# Las comprobaciones leen las fórmulas directamente de index.html, así que
# cualquier cambio que rompa la física hace fallar el build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Comprobar contra valores de libro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Ejecutar las comprobaciones
        run: node tools/verify.mjs
